services:
  # =========================================================
  # Clash Subscription Decoder 全栈应用服务 (连接外部已有的 PostgreSQL)
  # =========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE_REGISTRY: ${BASE_IMAGE_REGISTRY:-docker.io}
    container_name: clash-subscription-decoder-app
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}        # 应用服务监听端口
      - DB_HOST=your_external_postgres_host   # 外部 PostgreSQL 主机地址
      - DB_USER=clash_subscription_decoder_user # 外部数据库用户名
      - DB_PASSWORD=secure_db_password_9988   # 外部数据库密码
      - DB_NAME=clash_subscription_decoder_db # 外部数据库名称
      - DB_PORT=5432                          # 外部数据库端口
      - DB_SSLMODE=disable                    # SSL模式 (disable/require等)
      - DB_TIMEZONE=Asia/Shanghai             # 时区设置
      - SUBSCRIPTION_USER_AGENT=${SUBSCRIPTION_USER_AGENT:-clash.meta} # 上游订阅请求客户端标识
      - SUBSCRIPTION_PROXY_ENABLED=${SUBSCRIPTION_PROXY_ENABLED:-}     # 可选：是否启用订阅抓取代理池
      - SUBSCRIPTION_PROXY_URLS=${SUBSCRIPTION_PROXY_URLS:-}           # 可选：逗号、分号或换行分隔的代理池
      - SUBSCRIPTION_PROXY_URL=${SUBSCRIPTION_PROXY_URL:-}             # 兼容旧版：单个上游订阅抓取代理
      - SUBSCRIPTION_INSECURE_SKIP_VERIFY=${SUBSCRIPTION_INSECURE_SKIP_VERIFY:-false} # 自签名上游显式开关
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux 容器访问宿主机代理
    networks:
      - 1panel-network                        # 将服务绑定至 1Panel 的外部网络组
    restart: always

networks:
  # =========================================================
  # 声明接入 1Panel 宿主机上已有的外部共享网络组
  # =========================================================
  1panel-network:
    external: true                            # 声明为外部已存在的网络，由 Compose 直接接入而无需重复创建
