services:
  # =========================================================
  # ClashSubAST 全栈应用服务 (连接外部已有的 PostgreSQL)
  # =========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clash-sub-ast-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=your_external_postgres_host   # 外部 PostgreSQL 主机地址
      - DB_USER=clash_proxy_user              # 外部数据库用户名
      - DB_PASSWORD=secure_db_password_9988   # 外部数据库密码
      - DB_NAME=clash_proxy_db                # 外部数据库名称
      - DB_PORT=5432                          # 外部数据库端口
      - DB_SSLMODE=disable                    # SSL模式 (disable/require等)
      - DB_TIMEZONE=Asia/Shanghai             # 时区设置
    networks:
      - clash-sub-ast-net                    # 将服务绑定至自定义网络组
    restart: always

networks:
  # =========================================================
  # 自定义 Docker 隔离网络组
  # =========================================================
  clash-sub-ast-net:
    name: clash-sub-ast-net                  # 网络组名称
    driver: bridge                           # 驱动类型：桥接隔离模式
    # 💡 提示：如果您希望该容器直接加入已存在的外部共享 Docker 网络组
    #（例如与宿主机上其他独立运行的 PostgreSQL 数据库容器网络打通），请取消下方两行注释：
    # external: true
