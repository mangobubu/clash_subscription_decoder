[server]
# 服务端监听端口
port = 8080

[database]
host = "127.0.0.1"
user = "your_username"
password = "your_password"
dbname = "clash_subscription_decoder"
port = 5432
sslmode = "disable"
timezone = "Asia/Shanghai"

[subscription_fetch]
# 上游服务限制客户端类型时，填写本地 Clash/Mihomo 实际使用的 User-Agent
user_agent = "clash.meta"
# 是否使用代理池抓取远程订阅；关闭时明确直连，不读取系统 HTTP_PROXY
proxy_enabled = false
# 可选代理池；无协议前缀按 HTTP 代理处理
proxy_urls = []
# 旧版单代理配置仍受支持；未显式配置 proxy_enabled 时，非空值会自动启用代理
# Docker Desktop 访问宿主机 Clash 的示例：http://host.docker.internal:7890
proxy_url = ""
# 仅在上游确实使用自签名证书时开启；默认必须校验证书
insecure_skip_verify = false

[auth]
# 可选：控制台登录入口哈希，仅接受 32 位十六进制字符（访问路径为 /<哈希>）
# 环境变量 LOGIN_ENTRY_HASH 优先于此配置；两者均为空时首次启动会随机生成并持久化到数据库
login_entry_hash = ""
# 是否开启验证码 (true/false)
captcha_enabled = true
# 验证码字符长度 (建议 4-6)
captcha_length = 5
# 验证码图片宽度 (像素)
captcha_width = 160
# 验证码图片高度 (像素)
captcha_height = 60
# 验证码背景颜色 (支持十六进制如 #1e293b 或 rgba，建议和前端登录框底色搭配)
captcha_bg_color = "rgba(15, 23, 42, 0.6)"
# Captcha text color. Supports #RRGGBB, #RRGGBBAA and rgba(r,g,b,a); rendered into the PNG by the backend.
captcha_text_color = "#FFFFFF"
# Captcha candidate characters. The server randomly picks captcha_length characters from this pool.
captcha_source = "23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz"
# Captcha noise dot count. Set to 0 to disable noise dots.
captcha_noise_count = 18
# Captcha noise dot color. Supports #RRGGBB, #RRGGBBAA and rgba(r,g,b,a).
captcha_noise_color = "rgba(148, 163, 184, 0.45)"
