[database]
host = "db"                           # docker-compose 内部的数据库容器网络域名
user = "clash_proxy_user"
password = "secure_db_password_9988"  # 对应 docker-compose.yml 里的 POSTGRES_PASSWORD
dbname = "clash_proxy_db"
port = 5432
sslmode = "disable"
timezone = "Asia/Shanghai"

[auth]
# 是否开启验证码 (true/false)
captcha_enabled = true
# 验证码字符长度 (建议 4-6)
captcha_length = 5
# 验证码图片宽度 (像素)
captcha_width = 160
# 验证码图片高度 (像素)
captcha_height = 60
# 验证码背景颜色 (支持十六进制如 #1e293b 或 rgba，建议和前端登录框底色搭配)
captcha_bg_color = "rgba(15, 23, 42, 0.6)"
# 验证码文字颜色 (支持十六进制如 #FFFFFF，将通过前端动态渲染映射)
captcha_text_color = "#FFFFFF"
