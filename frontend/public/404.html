<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07111f" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 · 页面不存在</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          sans-serif;
        color: #f3f4f6;
        background: #07111f;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 12% 10%, rgba(14, 165, 233, 0.18), transparent 34%),
          radial-gradient(circle at 88% 90%, rgba(16, 185, 129, 0.12), transparent 30%),
          #07111f;
      }

      body::before,
      body::after {
        position: fixed;
        z-index: 0;
        width: 360px;
        height: 360px;
        border-radius: 50%;
        content: "";
        pointer-events: none;
        filter: blur(90px);
        opacity: 0.34;
        animation: drift 18s ease-in-out infinite alternate;
      }

      body::before {
        top: -120px;
        left: -100px;
        background: #0ea5e9;
      }

      body::after {
        right: -90px;
        bottom: -130px;
        background: #14b8a6;
        animation-delay: -7s;
      }

      main {
        position: relative;
        z-index: 1;
        display: grid;
        min-height: 100vh;
        padding: 24px;
        place-items: center;
      }

      .card {
        width: min(100%, 560px);
        padding: clamp(32px, 7vw, 54px);
        text-align: center;
        background: rgba(12, 24, 38, 0.84);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 20px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.42);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        animation: appear 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 22px;
        padding: 7px 12px;
        color: #bae6fd;
        font-size: 13px;
        line-height: 1;
        letter-spacing: 0.08em;
        background: rgba(14, 165, 233, 0.08);
        border: 1px solid rgba(56, 189, 248, 0.2);
        border-radius: 999px;
      }

      .status::before {
        width: 7px;
        height: 7px;
        background: #38bdf8;
        border-radius: 50%;
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
        content: "";
      }

      .code {
        margin: 0;
        color: transparent;
        font-size: clamp(74px, 19vw, 132px);
        font-weight: 750;
        line-height: 0.9;
        letter-spacing: -0.07em;
        background: linear-gradient(135deg, #e0f2fe 4%, #38bdf8 52%, #34d399 100%);
        background-clip: text;
        -webkit-background-clip: text;
        filter: drop-shadow(0 12px 32px rgba(14, 165, 233, 0.18));
      }

      h1 {
        margin: 26px 0 12px;
        color: #f3f4f6;
        font-size: clamp(24px, 5vw, 32px);
        font-weight: 650;
        line-height: 1.25;
        letter-spacing: 0.02em;
      }

      p {
        max-width: 410px;
        margin: 0 auto;
        color: #9ca3af;
        font-size: 15px;
        line-height: 1.8;
      }

      .hint {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 30px;
        padding: 15px 16px;
        color: #cbd5e1;
        font-size: 13px;
        line-height: 1.65;
        text-align: left;
        background: rgba(2, 6, 23, 0.3);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 12px;
      }

      .hint-icon {
        flex: 0 0 auto;
        display: grid;
        width: 22px;
        height: 22px;
        margin-top: 1px;
        color: #38bdf8;
        font-size: 13px;
        font-weight: 700;
        border: 1px solid rgba(56, 189, 248, 0.34);
        border-radius: 50%;
        place-items: center;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.985);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes drift {
        to {
          transform: translate(28px, 22px) scale(1.08);
        }
      }

      @media (max-width: 480px) {
        main {
          padding: 16px;
        }

        .card {
          padding: 34px 22px;
          border-radius: 16px;
        }

        .hint {
          margin-top: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body::before,
        body::after,
        .card {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="page-title">
        <div class="status">访问地址无效</div>
        <p class="code" aria-hidden="true">404</p>
        <h1 id="page-title">页面不存在</h1>
        <p>当前地址未对应任何可访问页面，请确认地址是否完整且输入正确。</p>
        <div class="hint" role="note">
          <span class="hint-icon" aria-hidden="true">i</span>
          <span>管理控制台使用私有入口访问，请检查管理员提供的私有入口地址。</span>
        </div>
      </section>
    </main>
  </body>
</html>
